# Pedestrian Configuration for Isaac Sim
# This file defines pedestrians to be spawned in the simulation

# List of pedestrians to spawn
pedestrians:
  # Pedestrian 1: pedestrian_1 walking from left to right
  - name: "pedestrian_1"
    character: "male_adult_construction_01_new" 
    position: [2.0, 0.0, 0.0]
    yaw: 0.0  # Initial orientation in radians
    target_position:
      - [3.5, 0.0, 0.0]
      - [5.0, -10.0, 0.0]
      - [7.0, 0.0, 0.0]
    walk_speed: 0.8

  # Pedestrian 2: pedestrian_2 walking in different path
  - name: "pedestrian_2"
    character: "male_adult_construction_03"
    position: [3.0, 2.0, 0.0]
    yaw: 1.5707963267948966  # 90 degrees
    target_position:
      - [3.5, 7.0, 0.0]
      - [2.5, -5.0, 0.0]
      - [2.0, 8.0, 0.0]
    walk_speed: 0.6

  # Pedestrian 3: pedestrian_3 creating traffic around robot
  - name: "pedestrian_3"
    character: "male_adult_construction_05_new"
    position: [-3.0, 1.0, 0.0]
    yaw: 0.0
    target_position:
      - [0.0, -10.0, 0.0]
      - [3.0, 3.0, 0.0]
      - [5.0, 0.0, 0.0]
    walk_speed: 0.7

# NavMesh Settings for pedestrian obstacle avoidance
navmesh:
  agent_height: 1.7  # Height of pedestrian for navmesh calculation
  agent_radius: 0.31  # Radius for collision avoidance
  exclude_rigid_bodies: false  # Include robot in obstacle avoidance
  auto_rebake_on_changes: false  # Build navmesh once at start
  view_navmesh: false  # Show visualization of navmesh
